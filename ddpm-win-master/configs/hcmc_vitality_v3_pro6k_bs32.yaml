# HCMC Urban Vitality v3 — Batch Size Ablation: bs=32 (8M samples target)
#
# Phase 1.5.3 bs ablation: bs=16/32/64/128 all at 8M samples (matches 5090 setup's 500K steps at bs=16).
# Fixed LR=1e-4 (adaptive: bump to 2e-4 if underfitting detected).
#
# Wall time: ~23h at 2.97 it/s on Pro 6000 Blackwell.
# run_name auto-generated: hcmc_vitality_v2_128x128_steps250000.

use_dual_gpu: false

dataset_name: "hcmc_vitality_v2"
img_channels: 3
img_size: 128
batch_size: 32

model_channels: 128

lr: 0.0001
n_steps: 250000
timesteps: 1000
log_every: 100

val_every: 5000
val_steps: 50

schedule_type: "linear"
b0: 0.0001
bT: 0.02
beta: 0.006
beta_d: 19.9
beta_min: 0.1
sigma_min: 0.02
sigma_max: 100.0

data_root: "../data-processing/data/hcmc/processed/cells"
checkpoint_dir: "model_ckpts/hcmc_vitality_v3_pro6k_bs32"
log_dir: "logs/hcmc_vitality_v3_pro6k_bs32"

center: true
normalize: true

# Checkpointing — samples-seen grid aligned with bs=16 baseline.
save_initial:
  - 25       # 800 samples
  - 63       # 2K samples
  - 125      # 4K samples
  - 250      # 8K samples
  - 625      # 20K samples
  - 1250     # 40K samples
  - 2500     # 80K samples
  - 5000     # 160K samples
  - 12500    # 400K samples
  - 25000    # 800K samples
  - 50000    # 1.6M samples
  - 75000    # 2.4M samples
  - 100000   # 3.2M samples
  - 125000   # 4M samples (= v3_pro6k's full training endpoint)
  - 156250   # 5M samples
  - 187500   # 6M samples
  - 218750   # 7M samples
  - 250000   # 8M samples (final)
save_interval: 1000000
