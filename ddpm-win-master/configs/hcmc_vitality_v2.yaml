# HCMC Urban Vitality v2 — DDPM training configuration
# RGB cell images from data-processing pipeline v2 (4,182 non-empty 128x128 PNGs)
# Channel order: R=accessibility, G=diversity, B=density

# Device settings
use_dual_gpu: true

# Dataset settings
dataset_name: "hcmc_vitality_v2"
img_channels: 3
img_size: 128
batch_size: 16

# Model
model_channels: 32

# Training (step-based)
lr: 0.0001
n_steps: 50000
timesteps: 1000
log_every: 100

# Diffusion schedule configuration
schedule_type: "linear"
# Linear schedule parameters (DDPM standard naming)
b0: 0.0001
bT: 0.02
# Fixed schedule parameters
beta: 0.006
# VP schedule parameters (Song et al. SDE naming)
beta_d: 19.9
beta_min: 0.1
# VE schedule parameters (Song et al. SDE naming)
sigma_min: 0.02
sigma_max: 100.0

# Paths
data_root: "../data-processing/data/hcmc/processed/cells"
checkpoint_dir: "model_ckpts/hcmc_vitality_v2"
log_dir: "logs/hcmc_vitality_v2"

# Normalization
center: true
normalize: true

# Checkpointing (logarithmic for generalization window analysis)
save_initial:
  - 100
  - 250
  - 500
  - 1000
  - 2500
  - 5000
  - 10000
  - 20000
  - 40000
  - 50000
save_interval: 5000
