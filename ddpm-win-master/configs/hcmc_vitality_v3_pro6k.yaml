# HCMC Urban Vitality v3 — Pro 6000 Blackwell (96GB) Single GPU Configuration
#
# Benchmark results (ch=128, Pro 6000 Blackwell Max-Q, CUDA 12.8):
#   bs=8:   10.98 it/s,  6.4 GB,  ~13h for 500K  ← SELECTED
#   bs=16:   5.67 it/s, 10.4 GB,  ~25h
#   bs=32:   2.97 it/s, 18.4 GB,  ~47h
#   bs=64:   1.47 it/s, 34.8 GB,  ~94h
#   bs=128:  0.72 it/s, 67.9 GB, ~192h
#
# Throughput ~90 samples/s regardless of batch size (compute-bound).
# bs=8 = fastest wall time + most gradient updates = best for diffusion training.
# 2.3x faster than dual RTX 3090 (10.98 vs 4.78 it/s).
#
# Fresh training run (new branch, no resume).

# Device settings — single Pro 6000, no DataParallel
use_dual_gpu: false

# Dataset settings
dataset_name: "hcmc_vitality_v2"
img_channels: 3
img_size: 128
batch_size: 8

# Model (ch=128, ~157.8M params)
model_channels: 128

# Training (step-based)
lr: 0.0001
n_steps: 500000
timesteps: 1000
log_every: 100

# Validation loss tracking
val_every: 5000
val_steps: 50

# Diffusion schedule configuration
schedule_type: "linear"
# Linear schedule parameters (DDPM standard naming)
b0: 0.0001
bT: 0.02
# Fixed schedule parameters
beta: 0.006
# VP schedule parameters (Song et al. SDE naming)
beta_d: 19.9
beta_min: 0.1
# VE schedule parameters (Song et al. SDE naming)
sigma_min: 0.02
sigma_max: 100.0

# Paths
data_root: "../data-processing/data/hcmc/processed/cells"
checkpoint_dir: "model_ckpts/hcmc_vitality_v3_pro6k"
log_dir: "logs/hcmc_vitality_v3_pro6k"

# Normalization
center: true
normalize: true

# Checkpointing (logarithmic for generalization window analysis)
save_initial:
  - 100
  - 250
  - 500
  - 1000
  - 2500
  - 5000
  - 10000
  - 20000
  - 50000
  - 100000
  - 200000
  - 300000
  - 400000
  - 500000
save_interval: 10000
