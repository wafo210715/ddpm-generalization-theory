# HCMC Urban Vitality v3 — Batch Size Ablation: bs=128 (8M samples target)
#
# Phase 1.5.3 bs ablation: bs=16/32/64/128 all at 8M samples (matches 5090 setup's 500K steps at bs=16).
# Fixed LR=1e-4 (adaptive: bump to 4e-4 if underfitting detected).
#
# Wall time: ~24h at 0.72 it/s on Pro 6000 Blackwell (67.9 GB peak).
# run_name auto-generated: hcmc_vitality_v2_128x128_steps62500.
# Note: bs=128 is the most likely to underfit at fixed LR — watch val_loss curve carefully.

use_dual_gpu: false

dataset_name: "hcmc_vitality_v2"
img_channels: 3
img_size: 128
batch_size: 128

model_channels: 128

lr: 0.0001
n_steps: 62500
timesteps: 1000
log_every: 100

val_every: 5000
val_steps: 50

schedule_type: "linear"
b0: 0.0001
bT: 0.02
beta: 0.006
beta_d: 19.9
beta_min: 0.1
sigma_min: 0.02
sigma_max: 100.0

data_root: "../data-processing/data/hcmc/processed/cells"
checkpoint_dir: "model_ckpts/hcmc_vitality_v3_pro6k_bs128"
log_dir: "logs/hcmc_vitality_v3_pro6k_bs128"

center: true
normalize: true

# Checkpointing — samples-seen grid aligned with bs=16 baseline.
save_initial:
  - 7        # 800 samples
  - 16       # 2K samples
  - 31       # 4K samples
  - 63       # 8K samples
  - 156      # 20K samples
  - 313      # 40K samples
  - 625      # 80K samples
  - 1250     # 160K samples
  - 3125     # 400K samples
  - 6250     # 800K samples
  - 12500    # 1.6M samples
  - 18750    # 2.4M samples
  - 25000    # 3.2M samples
  - 31250    # 4M samples (= v3_pro6k's full training endpoint)
  - 39063    # 5M samples
  - 46875    # 6M samples
  - 54688    # 7M samples
  - 62500    # 8M samples (final)
save_interval: 1000000
