<h1>论文数据源 → 指标，HCMC 能否做到</h1>
<p class="sub">一行是读过的论文里的一个数据源：它被算成了哪些指标，HCMC 用什么数据源能算出类似的指标，以及局限。读一篇加一篇。

const table=(title,rows)=>`<table><caption>${title}</caption><thead><tr><th style="width:15%">论文的数据源</th><th style="width:20%">论文算出的指标</th><th style="width:15%">HCMC 数据源</th><th style="width:22%">HCMC 能算出的类似指标</th><th style="width:28%">局限</th></tr></thead><tbody>`+
 rows.map(r=>`<tr><td><b>${r.psrc}</b><small>${r.paper}</small></td><td>${li(r.pind)}</td><td>${r.src}</td><td>${li(r.ind)}</td><td>${li(r.lim)}</td></tr>`).join("")+"</tbody></table>";
document.getElementById("out").innerHTML=table("建成环境",BE)+table("Human-centric",HUMAN);
